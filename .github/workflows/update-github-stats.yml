name: Update GitHub stats
on:
  schedule:
  - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm install --no-audit --no-fund
    - name: Fetch stars, forks and open issues
      run: node scripts/update-github-stats.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Commit snapshot if it changed
      run: |
        git diff --quiet -- src/github-stats.json && exit 0
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add src/github-stats.json
        git commit -m "Update GitHub stats snapshot"
        git push
